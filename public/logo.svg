<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="4" fill="#0a0a0f"/>
  <!-- Candlestick 1 (green/bullish) -->
  <line x1="7" y1="4" x2="7" y2="28" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="4" y="8" width="6" height="12" rx="1" fill="#22c55e"/>
  <!-- Candlestick 2 (red/bearish) -->
  <line x1="16" y1="6" x2="16" y2="26" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="13" y="10" width="6" height="10" rx="1" fill="#ef4444"/>
  <!-- Candlestick 3 (green/bullish) -->
  <line x1="25" y1="3" x2="25" y2="24" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="22" y="6" width="6" height="14" rx="1" fill="#22c55e"/>
</svg>
